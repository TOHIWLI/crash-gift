<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050609">
<title>CRASH GIFT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#f4f4f4;font-family:Arial,sans-serif;text-align:center;min-height:100vh;overflow-x:hidden}
header{padding:17px 10px 3px;font-size:27px;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 16px #8c42ff}
header span{color:#d56cff}.sub{font-size:10px;letter-spacing:4px;color:#999;margin-bottom:14px}
.wallet{margin:0 auto 12px;width:92%;max-width:540px;border:1px solid #393939;border-radius:18px;padding:14px 17px;background:#202020;display:flex;justify-content:space-between;align-items:center;font-size:13px;box-shadow:0 5px 18px #0008}
.wallet strong{color:#70e6b0;font-size:17px}
.game{width:94%;max-width:540px;height:430px;margin:auto;border:0;border-radius:18px;overflow:hidden;position:relative;background:#101010;box-shadow:inset 0 0 45px #000}
#screen{width:100%;height:100%;display:block}
.multiplier{position:absolute;top:8%;left:0;width:100%;font-size:clamp(38px,11vw,54px);font-weight:900;color:#fff;text-shadow:0 0 22px #bd63ff;pointer-events:none;z-index:2;direction:ltr}
.multiplier.crashed{color:#ff646e;text-shadow:0 0 25px red}
.status{min-height:30px;margin:10px auto 8px;font-size:13px;color:#c6c6c6;font-weight:bold;padding:0 10px}
.controls{width:94%;max-width:540px;margin:auto}.betrow{display:flex;gap:8px;justify-content:center;align-items:center}
input{min-width:0;width:36%;background:#242424;border:1px solid #484848;border-radius:13px;padding:15px 5px;color:white;font-size:18px;text-align:center;outline:none}
button{border:0;border-radius:13px;padding:15px 16px;font-size:14px;font-weight:900;cursor:pointer;color:white;background:linear-gradient(110deg,#8a37d7,#ba4ce8);box-shadow:0 4px 18px #a33be633}
button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}.betrow button{flex:1}
.buttons{display:flex;gap:10px;margin-top:11px}.buttons button{flex:1;padding:18px 8px}
#cash{background:linear-gradient(110deg,#0b9cba,#2465ed);color:white}
.section{width:94%;max-width:540px;margin:17px auto;background:#242424;border:1px solid #353535;border-radius:20px;padding:14px}
.section h3{margin:0 0 13px;text-align:right;font-size:14px;color:#ddd}
.history{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;direction:ltr}
.pill{padding:9px 13px;border-radius:11px;background:#193b2e;color:#65e7a7;font-weight:bold;white-space:nowrap;border:1px solid #347e5b}
.pill.low{background:#402020;color:#ff7777;border-color:#a34b54}.pill.mid{background:#3c3017;color:#f4ca68;border-color:#9d7b32}
.info{display:flex;justify-content:space-between;color:#aaa;font-size:12px;margin-top:12px}
.footer{color:#777;font-size:10px;padding:14px 0 22px;letter-spacing:2px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#d68aff;background:#101010;z-index:5;font-size:13px}
@media(max-width:380px){.game{height:390px}.wallet{font-size:12px}.wallet strong{font-size:15px}}
</style>
</head>
<body>
<header>🚀 <span>CRASH</span> GIFT</header>
<div class="sub">PLAY • FLY • WIN</div>
<div class="wallet"><span>💎 VIRTUAL BALANCE</span><strong id="balance">1,000 CG</strong></div>
<div class="game">
 <canvas id="screen"></canvas>
 <div class="multiplier" id="multiplier">1.00x</div>
 <div class="loading" id="loading">در حال بارگذاری موتور سه‌بعدی…</div>
</div>
<div class="status" id="status">READY FOR TAKEOFF?</div>
<div class="controls">
 <div class="betrow">
  <input id="bet" type="number" min="1" step="1" value="50">
  <button onclick="setBet(100)">100</button><button onclick="setBet(500)">500</button>
 </div>
 <div class="buttons"><button id="start" onclick="startGame()">🚀 START</button><button id="cash" onclick="cashOut()" disabled>💎 CASH OUT</button></div>
</div>
<div class="section">
 <h3>📈 RECENT MULTIPLIERS</h3><div class="history" id="history"><span style="color:#777">No rounds yet</span></div>
 <div class="info"><span>CRASH GIFT</span><span>VIRTUAL GAME</span></div>
</div>
<div class="footer">CRASH GIFT • PLAY BEYOND LIMITS</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $=id=>document.getElementById(id);
const canvas=$('screen');
let balance=Number(localStorage.getItem('cg_balance')||1000);
let history=JSON.parse(localStorage.getItem('cg_history')||'[]');
let phase='idle',cashed=false,bet=0,mult=1,crashPoint=0,roundStart=0,crashStart=0,prize=0;
let renderer,scene,camera,rocket,rocketGroup,flame,flameLight,earth,planet,starField,trail;
let smoke=[],embers=[],explosion=[],clock=new THREE.Clock();
const v=(x,y,z)=>new THREE.Vector3(x,y,z);

function save(){localStorage.setItem('cg_balance',String(balance));localStorage.setItem('cg_history',JSON.stringify(history))}
function updateBalance(){$('balance').textContent=balance.toLocaleString()+' CG'}
window.setBet=n=>{$('bet').value=n};

function makeMat(color,metalness=0,roughness=.5,emissive=0x000000,intensity=0){
 return new THREE.MeshStandardMaterial({color,metalness,roughness,emissive,emissiveIntensity:intensity});
}
function createRocket(){
 rocketGroup=new THREE.Group();
 const bodyMat=new THREE.MeshStandardMaterial({color:0x111820,metalness:.72,roughness:.22,emissive:0x06111c,emissiveIntensity:.5});
 const cyan=new THREE.MeshBasicMaterial({color:0x39f5ff});
 const pink=new THREE.MeshBasicMaterial({color:0xff38d9});
 const violet=new THREE.MeshBasicMaterial({color:0xb74dff});
 const gold=new THREE.MeshBasicMaterial({color:0xffe52e});
 const glass=new THREE.MeshPhysicalMaterial({color:0x087f99,metalness:.45,roughness:.08,clearcoat:1,emissive:0x00c9e8,emissiveIntensity:1.15});
 // Slim upright fuselage, rounded nose and dark central shell.
 const core=new THREE.Mesh(new THREE.CylinderGeometry(.48,.58,2.15,24,1),bodyMat);
 core.position.y=.05;rocketGroup.add(core);
 const nose=new THREE.Mesh(new THREE.ConeGeometry(.48,.82,24),bodyMat);
 nose.position.y=1.52;rocketGroup.add(nose);
 const noseOutline=new THREE.Mesh(new THREE.TorusGeometry(.48,.035,8,40),cyan);
 noseOutline.position.y=1.15;rocketGroup.add(noseOutline);
 const lowerRing=new THREE.Mesh(new THREE.TorusGeometry(.54,.035,8,40),pink);
 lowerRing.position.y=-.82;rocketGroup.add(lowerRing);
 // Glowing cockpit windows.
 const cockpit=new THREE.Mesh(new THREE.SphereGeometry(.34,24,16),glass);
 cockpit.scale.set(1,.75,.22);cockpit.position.set(0,.48,.49);rocketGroup.add(cockpit);
 const cockpitFrame=new THREE.Mesh(new THREE.TorusGeometry(.36,.035,8,40),cyan);
 cockpitFrame.position.set(0,.48,.5);cockpitFrame.scale.set(1,.82,1);rocketGroup.add(cockpitFrame);
 const smallWindow=new THREE.Mesh(new THREE.SphereGeometry(.2,20,12),glass);
 smallWindow.scale.set(1,.62,.18);smallWindow.position.set(0,-.35,.51);rocketGroup.add(smallWindow);
 const smallFrame=new THREE.Mesh(new THREE.TorusGeometry(.22,.027,8,32),cyan);
 smallFrame.position.set(0,-.35,.52);smallFrame.scale.set(1,.72,1);rocketGroup.add(smallFrame);
 // Side fins with neon edges.
 for(const side of [-1,1]){
  const finShape=new THREE.Shape();
  finShape.moveTo(0,0);finShape.lineTo(side*.58,-.82);finShape.lineTo(side*.35,-.92);finShape.lineTo(side*.12,-.45);finShape.closePath();
  const fin=new THREE.Mesh(new THREE.ShapeGeometry(finShape),bodyMat);
  fin.position.set(0,-.58,.03);rocketGroup.add(fin);
  const edgePts=[v(0,-.58,.08),v(side*.58,-1.4,.08),v(side*.35,-1.5,.08),v(side*.12,-1.03,.08),v(0,-.58,.08)];
  const edge=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(edgePts),32,.025,8,false),pink);rocketGroup.add(edge);
 }
 // Tiny gold engine details and a layered neon exhaust.
 const engine=new THREE.Mesh(new THREE.CylinderGeometry(.25,.34,.32,24),bodyMat);
 engine.position.y=-1.18;rocketGroup.add(engine);
 const engineRing=new THREE.Mesh(new THREE.TorusGeometry(.3,.035,8,32),gold);
 engineRing.position.y=-1.32;rocketGroup.add(engineRing);
 flame=new THREE.Mesh(new THREE.ConeGeometry(.27,1.25,24,1,true),new THREE.MeshBasicMaterial({color:0xffe52e,transparent:true,opacity:.82,side:THREE.DoubleSide}));
 flame.rotation.z=Math.PI;flame.position.y=-1.95;rocketGroup.add(flame);
 const inner=new THREE.Mesh(new THREE.ConeGeometry(.13,.82,20,1,true),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9,side:THREE.DoubleSide}));
 inner.rotation.z=Math.PI;inner.position.y=-1.78;rocketGroup.add(inner);
 flameLight=new THREE.PointLight(0xffd52e,3.5,8);flameLight.position.y=-1.7;rocketGroup.add(flameLight);
 // Neon halo around the whole craft.
 const halo=new THREE.Mesh(new THREE.TorusGeometry(.83,.018,8,64),new THREE.MeshBasicMaterial({color:0xb344ff,transparent:true,opacity:.7}));
 halo.position.z=-.12;rocketGroup.add(halo);
 rocketGroup.scale.setScalar(.92);scene.add(rocketGroup);
}
function createWorld(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x101010);
 camera=new THREE.PerspectiveCamera(48,1,.1,1000);camera.position.set(0,1,24);
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
 scene.add(new THREE.HemisphereLight(0x9a9ab8,0x120b18,1.1));
 const key=new THREE.PointLight(0x9d4cff,32,38);key.position.set(2,6,9);scene.add(key);
 const cyanLight=new THREE.PointLight(0x00dfff,22,30);cyanLight.position.set(-5,2,5);scene.add(cyanLight);
 const pinkLight=new THREE.PointLight(0xff28cf,18,25);pinkLight.position.set(5,-2,5);scene.add(pinkLight);
 // Sparse, soft stars and drifting colored particles.
 const count=650,positions=new Float32Array(count*3);
 for(let i=0;i<count;i++){positions[i*3]=(Math.random()-.5)*95;positions[i*3+1]=(Math.random()-.5)*65;positions[i*3+2]=-Math.random()*75-8}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
 starField=new THREE.Points(geo,new THREE.PointsMaterial({color:0xd8d2e6,size:.11,sizeAttenuation:true,transparent:true,opacity:.72}));scene.add(starField);
 // The signature golden flight ribbon: layered tubes create a soft neon bloom.
 const pts=[v(-31,-7,-2),v(-23,-7,-2),v(-15,-7,-2),v(-8,-6.7,-2),v(-3,-5.5,-2),v(0,-2.8,-2),v(2,1.5,-2),v(4,7,-2),v(6,14,-2),v(8,22,-2),v(10,31,-2)];
 const curve=new THREE.CatmullRomCurve3(pts);
 const glow=new THREE.Mesh(new THREE.TubeGeometry(curve,180,.38,12,false),new THREE.MeshBasicMaterial({color:0xffe000,transparent:true,opacity:.12}));
 const mid=new THREE.Mesh(new THREE.TubeGeometry(curve,180,.19,12,false),new THREE.MeshBasicMaterial({color:0xffd900,transparent:true,opacity:.32}));
 trail=new THREE.Mesh(new THREE.TubeGeometry(curve,180,.075,12,false),new THREE.MeshBasicMaterial({color:0xfff02a}));
 scene.add(glow,mid,trail);
 createRocket();
}
function resize(){
 if(!renderer)return;const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);

function addParticles(list,pos,color,n,spread,speed,size){
 for(let i=0;i<n;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(size*(.45+Math.random()),8,6),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8}));
  m.position.copy(pos).add(v((Math.random()-.5)*spread,(Math.random()-.5)*spread,(Math.random()-.5)*spread));scene.add(m);
  list.push({mesh:m,vel:v((Math.random()-.5)*speed,(Math.random()-.5)*speed,(Math.random()-.5)*speed),life:1});
 }
}
function updateParticles(list,dt,fade=.8){
 for(let i=list.length-1;i>=0;i--){const p=list[i];p.mesh.position.addScaledVector(p.vel,dt);p.vel.y-=dt*.7;p.life-=dt*fade;p.mesh.scale.multiplyScalar(1+dt*.4);p.mesh.material.opacity=Math.max(0,p.life*.8);if(p.life<=0){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();list.splice(i,1)}}
}
function flightPosition(){
 const t=Math.max(0,mult-1);
 const d=Math.log(1+t*1.9)*4.7;
 return v(-1.5+d*.43,-3.2+d*.9+Math.sin(performance.now()*.0018)*.12,0);
}
function setCameraTarget(pos,dt){
 const desired=v(pos.x-1.5,pos.y+1.2,24);
 camera.position.lerp(desired,1-Math.exp(-dt*2.8));
 camera.lookAt(pos.x,pos.y+.2,-5);
}
function beginCrash(){
 if(phase!=='flight')return;
 phase='crash';crashStart=performance.now();$('cash').disabled=true;
 $('status').textContent=cashed?'🎉 جایزه ثبت شد؛ سقوط موشک را تماشا کن!':'💥 موشک در حال سقوط است!';
 $('multiplier').classList.add('crashed');$('multiplier').textContent='💥 '+crashPoint.toFixed(2)+'x';
}
function completeRound(){
 phase='idle';$('start').disabled=false;$('cash').disabled=true;
 $('status').textContent=cashed?'🎉 برنده شدی! دور بعد آماده است':'💥 موشک سقوط کرد؛ دور بعد آماده است';
 history.unshift(crashPoint);history=history.slice(0,30);save();renderHistory();updateBalance();
}
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),now=performance.now();
 if(phase==='flight'){
  const seconds=(now-roundStart)/1000;mult=Math.exp(seconds*.22);
  if(mult>=crashPoint){mult=crashPoint;beginCrash()}
  else $('multiplier').textContent=mult.toFixed(2)+'x';
 }
 if(phase==='crash'){
  const elapsed=(now-crashStart)/1000;
  rocketGroup.rotation.z=-.28-elapsed*1.35;rocketGroup.rotation.x=Math.sin(elapsed*9)*.12;
  rocketGroup.position.y-=dt*(2.2+elapsed*4.8);rocketGroup.position.x+=dt*1.1;
  if(Math.random()<.8)addParticles(smoke,rocketGroup.position,0x6b6678,2,1.4,1.1,.18);
  if(elapsed>.42&&explosion.length===0)addParticles(explosion,rocketGroup.position,0xff43d7,90,3,7,.16);
  if(elapsed>2.7)completeRound();
 }else if(phase==='flight'){
  const pos=flightPosition();rocketGroup.position.lerp(pos,1-Math.exp(-dt*5));
  rocketGroup.rotation.z=-.28+Math.sin(now*.002)*.018;
  rocketGroup.rotation.x=Math.sin(now*.0014)*.025;
  flame.scale.set(1,.78+Math.random()*.42, .78+Math.random()*.42);
  flameLight.intensity=3.2+Math.random()*2.2;
  if(Math.random()<.72)addParticles(embers,rocketGroup.position.clone().add(v(-2.5,0,0)),0x39f5ff,2,1.1,2,.055);
 }else{
  rocketGroup.rotation.z=-.28;rocketGroup.position.lerp(v(-1.5,-3.2,0),.035);
  flameLight.intensity=0;
 }
 setCameraTarget(rocketGroup.position,dt);
 starField.rotation.y+=dt*.0008;
 updateParticles(embers,dt,1.4);updateParticles(smoke,dt,.36);updateParticles(explosion,dt,.95);
 renderer.render(scene,camera);
}
function renderHistory(){
 $('history').innerHTML='';
 if(!history.length){$('history').innerHTML='<span style="color:#777">No rounds yet</span>';return}
 history.slice(0,15).forEach(n=>{const el=document.createElement('span');el.className='pill '+(n<2?'low':n<5?'mid':'');el.textContent=n.toFixed(2)+'x';$('history').appendChild(el)});
}
window.startGame=function(){
 if(phase!=='idle')return;
 bet=Number($('bet').value);
 if(!Number.isInteger(bet)||bet<1||bet>balance){$('status').textContent='INVALID BET AMOUNT';return}
 balance-=bet;save();updateBalance();mult=1;cashed=false;prize=0;
 crashPoint=Math.max(1.05,.98/Math.random());roundStart=performance.now();phase='flight';
 rocketGroup.position.set(-2,-1,0);rocketGroup.rotation.set(0,0,-.12);
 $('start').disabled=true;$('cash').disabled=false;$('multiplier').classList.remove('crashed');
 $('multiplier').textContent='1.00x';$('status').textContent='🚀 موشک در حال پرواز است!';
};
window.cashOut=function(){
 if(phase!=='flight'||cashed)return;
 cashed=true;prize=Math.floor(bet*mult);balance+=prize;
 $('cash').disabled=true;$('status').textContent='🎉 '+prize.toLocaleString()+' CG دریافت کردی؛ پرواز ادامه دارد!';
 save();updateBalance();
};
try{
 createWorld();resize();$('loading').style.display='none';animate();
}catch(e){
 console.error(e);$('loading').textContent='موتور سه‌بعدی بارگذاری نشد؛ اتصال اینترنت را بررسی کن.';
}
updateBalance();renderHistory();
</script>
</body>
</html>
