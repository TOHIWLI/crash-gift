
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRASH GIFT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#f5d47a;font-family:Arial,sans-serif;text-align:center}
header{padding:24px;font-size:30px;font-weight:bold;letter-spacing:3px}
.wallet{margin:10px auto;padding:14px;border:1px solid #b99442;border-radius:12px;width:85%;max-width:350px}
.game{margin:30px auto;width:90%;max-width:420px;height:270px;background:radial-gradient(#29200c,#090909);border:1px solid #70551d;border-radius:18px;position:relative;overflow:hidden}
#rocket{font-size:48px;position:absolute;left:12%;bottom:25px}
#multiplier{font-size:45px;margin-top:70px;font-weight:bold}
.controls{margin:20px}
input{background:#191919;color:white;border:1px solid #b99442;padding:14px;border-radius:9px;width:120px}
button{background:linear-gradient(90deg,#a77b20,#f5d47a);border:0;padding:14px 24px;border-radius:9px;font-weight:bold;margin:8px;cursor:pointer}
button:disabled{opacity:.4}
#status{margin:18px;font-size:18px}
</style>
</head>
<body>
<header>🚀 CRASH GIFT</header>
<div class="wallet">💎 BALANCE: <span id="balance">1000</span> CG</div>
<div class="game">
<div id="multiplier">1.00x</div>
<div id="rocket">🚀</div>
</div>
<div class="controls">
<input id="bet" type="number" min="1" max="1000" value="50">
<div>
<button id="start" onclick="startGame()">START</button>
<button id="cash" onclick="cashOut()" disabled>CASH OUT</button>
</div>
<div id="status">READY TO PLAY?</div>
</div>
<script>
let balance=1000,bet=0,mult=1,crash=1,playing=false,timer=null,cashed=false;
const $=id=>document.getElementById(id);
function update(){
$('balance').textContent=balance;
$('multiplier').textContent=mult.toFixed(2)+'x';
$('rocket').style.left=Math.min(12+(mult-1)*9,82)+'%';
$('rocket').style.bottom=Math.min(25+(mult-1)*8,180)+'px';
}
function startGame(){
if(playing)return;
bet=Number($('bet').value);
if(!Number.isInteger(bet)||bet<1||bet>balance){
$('status').textContent='INVALID BET';return;
}
balance-=bet;mult=1;cashed=false;playing=true;
crash=1+(-Math.log(1-Math.random())*1.3);
$('start').disabled=true;$('cash').disabled=false;
$('status').textContent='ROCKET IS FLYING!';
timer=setInterval(()=>{
mult+=0.025+mult*0.012;
update();
if(mult>=crash)finish();
},100);
}
function cashOut(){
if(!playing||cashed)return;
cashed=true;clearInterval(timer);playing=false;
let prize=Math.floor(bet*mult);
balance+=prize;
$('status').textContent='YOU WON '+prize+' CG!';
$('cash').disabled=true;$('start').disabled=false;
update();
}
function finish(){
clearInterval(timer);playing=false;
$('status').textContent=cashed?'ROUND COMPLETE':'CRASHED! YOU LOST '+bet+' CG';
$('cash').disabled=true;$('start').disabled=false;
}
</script>
</body>
</html>
