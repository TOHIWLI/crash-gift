<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050609">
<title>CRASH GIFT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050609;color:#f5d47a;font-family:Arial,sans-serif;text-align:center;min-height:100vh;overflow-x:hidden}
header{padding:20px 10px 7px;font-size:30px;font-weight:900;letter-spacing:3px;text-shadow:0 0 18px #d69c36}header span{color:#fff}.sub{font-size:10px;letter-spacing:5px;color:#a78a4c;margin-bottom:18px}
.wallet{margin:0 auto 14px;width:92%;max-width:520px;border:1px solid #98752d;border-radius:16px;padding:16px;background:linear-gradient(110deg,#211808,#090a0d);display:flex;justify-content:space-between;align-items:center;font-size:14px;box-shadow:0 0 20px #d9a33115}.wallet strong{color:#ffe39a;font-size:17px}
.game{width:94%;max-width:560px;height:min(66vh,570px);min-height:390px;margin:auto;border:1px solid #8d6929;border-radius:22px;overflow:hidden;position:relative;background:#030817;box-shadow:0 0 35px #e5a52b25,inset 0 0 30px #e4a72a20}#scene{position:absolute;inset:0;width:100%;height:100%;display:block}.multiplier{position:absolute;top:12%;left:0;width:100%;font-size:clamp(42px,12vw,58px);font-weight:900;color:#ffe18b;text-shadow:0 0 25px #ffad21;pointer-events:none;z-index:2}.multiplier.crashed{color:#ff5252;text-shadow:0 0 25px red}
.status{min-height:32px;margin:14px auto 10px;font-size:14px;color:#e6c875;font-weight:bold;padding:0 10px}.controls{width:94%;max-width:560px;margin:auto}.betrow{display:flex;gap:9px;justify-content:center;align-items:center}input{min-width:0;width:36%;background:#171717;border:1px solid #9b7934;border-radius:12px;padding:15px 5px;color:white;font-size:18px;text-align:center;outline:none}button{border:0;border-radius:12px;padding:16px 18px;font-size:15px;font-weight:900;cursor:pointer;color:#171006;background:linear-gradient(110deg,#a8791d,#ffe08a);box-shadow:0 4px 18px #d5a13b25}button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}.betrow button{flex:1}.buttons{display:flex;gap:10px;margin-top:12px}.buttons button{flex:1;padding:19px 8px}#cash{background:linear-gradient(110deg,#147b55,#40e4a0);color:#041b12}
.section{width:94%;max-width:560px;margin:22px auto;background:#111318;border:1px solid #49391e;border-radius:16px;padding:15px}.section h3{margin:0 0 14px;text-align:left;font-size:14px;color:#d8b75f}.history{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px}.pill{padding:9px 13px;border-radius:10px;background:#193b2e;color:#65e7a7;font-weight:bold;white-space:nowrap}.pill.low{background:#402020;color:#ff7777}.pill.mid{background:#3c3017;color:#f4ca68}.info{display:flex;justify-content:space-between;color:#aaa;font-size:12px;margin-top:12px}.footer{color:#66552e;font-size:11px;padding:15px 0 25px;letter-spacing:2px}
</style>
</head>
<body>
<header>🚀 <span>CRASH</span> GIFT</header><div class="sub">PLAY • FLY • WIN</div>
<div class="wallet"><span>💎 VIRTUAL BALANCE</span><strong id="balance">1,000 CG</strong></div>
<div class="game"><canvas id="scene"></canvas><div class="multiplier" id="multiplier">1.00x</div></div>
<div class="status" id="status">READY FOR TAKEOFF?</div>
<div class="controls"><div class="betrow"><input id="bet" type="number" min="1" step="1" value="50"><button onclick="setBet(100)">100</button><button onclick="setBet(500)">500</button></div><div class="buttons"><button id="start" onclick="startGame()">🚀 START</button><button id="cash" onclick="cashOut()" disabled>💎 CASH OUT</button></div></div>
<div class="section"><h3>📈 RECENT MULTIPLIERS</h3><div class="history" id="history"><span style="color:#777">No rounds yet</span></div><div class="info"><span>CRASH GIFT</span><span>VIRTUAL GAME</span></div></div>
<div class="footer">CRASH GIFT • VIRTUAL POINTS ONLY</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let balance=Number(localStorage.getItem('cg_balance')||1000);
let history=[];try{history=JSON.parse(localStorage.getItem('cg_history')||'[]');if(!Array.isArray(history))history=[]}catch(e){history=[]}
let roundActive=false,cashed=false,bet=0,mult=1,crashPoint=0,startTime=0,rocket,flame,renderer,scene,camera,earth,planet,stars,trail,explosion=null;
function save(){localStorage.setItem('cg_balance',balance);localStorage.setItem('cg_history',JSON.stringify(history))}
function updateBalance(){$('balance').textContent=balance.toLocaleString()+' CG'}
function setBet(n){$('bet').value=n}
function mat(color,metalness=0,roughness=.5,emissive=0){return new THREE.MeshStandardMaterial({color,metalness,roughness,emissive:color,emissiveIntensity:emissive})}
function makeRocket(){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CylinderGeometry(.28,.34,1.55,24),mat(0xd9e0eb,.8,.23,.08));g.add(body);
 const nose=new THREE.Mesh(new THREE.ConeGeometry(.29,.72,24),mat(0xffc75a,.65,.2,.25));nose.position.y=1.12;g.add(nose);
 const windowMesh=new THREE.Mesh(new THREE.SphereGeometry(.16,20,16),new THREE.MeshPhysicalMaterial({color:0x39bfff,metalness:.35,roughness:.12,emissive:0x087acb,emissiveIntensity:.65}));windowMesh.position.set(0,.38,.265);windowMesh.scale.set(1,1,.35);g.add(windowMesh);
 const finMat=mat(0xb77b28,.65,.28,.2);
 for(const side of [-1,1]){const fin=new THREE.Mesh(new THREE.BoxGeometry(.13,.55,.42),finMat);fin.position.set(side*.29,-.48,0);fin.rotation.z=side*.35;g.add(fin)}
 flame=new THREE.Mesh(new THREE.ConeGeometry(.24,1.05,20),new THREE.MeshBasicMaterial({color:0xff8b22,transparent:true,opacity:.9}));flame.position.y=-1.12;flame.rotation.z=Math.PI;g.add(flame);
 const inner=new THREE.Mesh(new THREE.ConeGeometry(.12,.72,16),new THREE.MeshBasicMaterial({color:0xffefad,transparent:true,opacity:.95}));inner.position.y=-1.12;inner.rotation.z=Math.PI;g.add(inner);
 g.rotation.z=-.68;g.scale.setScalar(.78);scene.add(g);return g;
}
function init3D(){
 if(!window.THREE){$('status').textContent='3D ENGINE COULD NOT LOAD — CHECK INTERNET';return}
 const canvas=$('scene');scene=new THREE.Scene();scene.background=new THREE.Color(0x030817);scene.fog=new THREE.FogExp2(0x050b1c,.018);
 camera=new THREE.PerspectiveCamera(48,1,.1,100);camera.position.set(0,0,16);
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
 scene.add(new THREE.AmbientLight(0x8ba8d8,.75));const sun=new THREE.DirectionalLight(0xffd79a,2.1);sun.position.set(-5,7,9);scene.add(sun);const blue=new THREE.PointLight(0x347bff,2.2,35);blue.position.set(5,1,5);scene.add(blue);
 // Earth-like planet and atmospheric rim
 earth=new THREE.Mesh(new THREE.SphereGeometry(7.1,48,40),new THREE.MeshStandardMaterial({color:0x163d70,roughness:.9,metalness:.05}));earth.position.set(0,-9.1,-5);scene.add(earth);
 const atmo=new THREE.Mesh(new THREE.SphereGeometry(7.22,48,40),new THREE.MeshBasicMaterial({color:0x398cff,transparent:true,opacity:.13,side:THREE.BackSide}));atmo.position.copy(earth.position);scene.add(atmo);
 // A distant ringed planet
 planet=new THREE.Group();const sphere=new THREE.Mesh(new THREE.SphereGeometry(1.25,40,32),new THREE.MeshStandardMaterial({color:0x536b9a,roughness:.42,metalness:.25}));planet.add(sphere);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(1.8,.045,8,100),new THREE.MeshStandardMaterial({color:0xc49b59,metalness:.7,roughness:.3,emissive:0x5a3710,emissiveIntensity:.35}));ring.rotation.x=1.18;planet.add(ring);planet.position.set(4.2,2.2,-2.5);scene.add(planet);
 // Star field
 const positions=[];for(let i=0;i<650;i++){positions.push((Math.random()-.5)*34,(Math.random()-.5)*23,-Math.random()*18-2)}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));stars=new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:.055,transparent:true,opacity:.9}));scene.add(stars);
 // Flight path
 const points=[];for(let i=0;i<=60;i++){const t=i/60;points.push(new THREE.Vector3(-5+t*10,-4+t*7.1,-.5))}const pathGeo=new THREE.BufferGeometry().setFromPoints(points);trail=new THREE.Line(pathGeo,new THREE.LineBasicMaterial({color:0xffc65a,transparent:true,opacity:.45}));scene.add(trail);
 rocket=makeRocket();resize3D();window.addEventListener('resize',resize3D);animate3D();
}
function resize3D(){if(!renderer||!camera)return;const box=$('scene').getBoundingClientRect();renderer.setSize(box.width,box.height,false);camera.aspect=box.width/box.height;camera.updateProjectionMatrix()}
function rocketPosition(p){return new THREE.Vector3(-5+p*10,-4+p*7.1,0)}
function animate3D(){requestAnimationFrame(animate3D);if(!renderer)return;const t=performance.now()*.001;
 if(planet)planet.rotation.y=t*.08;if(earth)earth.rotation.y=t*.015;if(stars)stars.rotation.z=Math.sin(t*.04)*.012;
 if(rocket){let p=roundActive?Math.min((mult-1)/8,1):0;const pos=rocketPosition(p);rocket.position.copy(pos);rocket.rotation.z=-.68+Math.sin(t*5)*.025;if(flame){flame.scale.set(1,.75+Math.random()*.55,1);flame.material.opacity=.72+Math.random()*.25}rocket.visible=roundActive||mult>1}
 if(explosion){explosion.rotation.y+=.025;explosion.scale.multiplyScalar(1.018);explosion.material.opacity=Math.max(0,explosion.material.opacity-.012);if(explosion.material.opacity<=0){scene.remove(explosion);explosion.geometry.dispose();explosion.material.dispose();explosion=null}}
 renderer.render(scene,camera)}
function burst(){if(!scene||!rocket)return;const count=90,arr=[];const pos=rocket.position.clone();for(let i=0;i<count;i++)arr.push(pos.x+(Math.random()-.5)*1.4,pos.y+(Math.random()-.5)*1.4,pos.z+(Math.random()-.5)*1.4);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));const m=new THREE.PointsMaterial({color:0xffa52e,size:.13,transparent:true,opacity:1});explosion=new THREE.Points(g,m);scene.add(explosion)}
function renderHistory(){$('history').innerHTML='';if(!history.length){$('history').innerHTML='<span style="color:#777">No rounds yet</span>';return}history.slice(0,15).forEach(n=>{const el=document.createElement('span');el.className='pill '+(n<2?'low':n<5?'mid':'');el.textContent=Number(n).toFixed(2)+'x';$('history').appendChild(el)})}
function finishRound(){if(!roundActive)return;roundActive=false;$('start').disabled=false;$('cash').disabled=true;$('multiplier').classList.add('crashed');$('multiplier').textContent='💥 '+crashPoint.toFixed(2)+'x';$('status').textContent=cashed?'🎉 WIN SECURED — FLIGHT COMPLETE':'💥 ROCKET CRASHED!';burst();history.unshift(crashPoint);history=history.slice(0,30);save();renderHistory();updateBalance()}
function startGame(){if(roundActive)return;bet=Number($('bet').value);if(!Number.isInteger(bet)||bet<1||bet>balance){$('status').textContent='INVALID BET AMOUNT';return}if(!renderer){$('status').textContent='3D ENGINE IS NOT READY';return}balance-=bet;save();updateBalance();mult=1;cashed=false;roundActive=true;startTime=performance.now();crashPoint=Math.max(1.05,.98/Math.random());$('start').disabled=true;$('cash').disabled=false;$('multiplier').classList.remove('crashed');$('multiplier').textContent='1.00x';$('status').textContent='🚀 ROCKET IS FLYING!';function tick(now){if(!roundActive)return;const seconds=(now-startTime)/1000;mult=Math.exp(seconds*.22);if(mult>=crashPoint){mult=crashPoint;$('multiplier').textContent=mult.toFixed(2)+'x';finishRound();return}$('multiplier').textContent=mult.toFixed(2)+'x';requestAnimationFrame(tick)}requestAnimationFrame(tick)}
function cashOut(){if(!roundActive||cashed)return;cashed=true;const prize=Math.floor(bet*mult);balance+=prize;$('cash').disabled=true;$('status').textContent='🎉 YOU WON '+prize+' CG! ROCKET STILL FLYING';save();updateBalance()}
updateBalance();renderHistory();init3D();
</script>
</body>
</html>
