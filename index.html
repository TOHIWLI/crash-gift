<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050609">
<title>CRASH GIFT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#f4f4f4;font-family:Arial,sans-serif;text-align:center;min-height:100vh;overflow-x:hidden}
header{padding:17px 10px 3px;font-size:27px;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 16px #8c42ff}
header span{color:#d56cff}.sub{font-size:10px;letter-spacing:4px;color:#999;margin-bottom:14px}
.wallet{margin:0 auto 12px;width:92%;max-width:540px;border:1px solid #393939;border-radius:18px;padding:14px 17px;background:#202020;display:flex;justify-content:space-between;align-items:center;font-size:13px;box-shadow:0 5px 18px #0008}
.wallet strong{color:#70e6b0;font-size:17px}
.game{width:94%;max-width:540px;height:430px;margin:auto;border:0;border-radius:18px;overflow:hidden;position:relative;background:#101010;box-shadow:inset 0 0 45px #000}
#screen{width:100%;height:100%;display:block}
.multiplier{position:absolute;top:8%;left:0;width:100%;font-size:clamp(38px,11vw,54px);font-weight:900;color:#fff;text-shadow:0 0 22px #bd63ff;pointer-events:none;z-index:2;direction:ltr}
.multiplier.crashed{color:#ff646e;text-shadow:0 0 25px red}
.status{min-height:30px;margin:10px auto 8px;font-size:13px;color:#c6c6c6;font-weight:bold;padding:0 10px}
.controls{width:94%;max-width:540px;margin:auto}.betrow{display:flex;gap:8px;justify-content:center;align-items:center}
input{min-width:0;width:36%;background:#242424;border:1px solid #484848;border-radius:13px;padding:15px 5px;color:white;font-size:18px;text-align:center;outline:none}
button{border:0;border-radius:13px;padding:15px 16px;font-size:14px;font-weight:900;cursor:pointer;color:white;background:linear-gradient(110deg,#8a37d7,#ba4ce8);box-shadow:0 4px 18px #a33be633}
button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}.betrow button{flex:1}
.buttons{display:flex;gap:10px;margin-top:11px}.buttons button{flex:1;padding:18px 8px}
#cash{background:linear-gradient(110deg,#0b9cba,#2465ed);color:white}
.section{width:94%;max-width:540px;margin:17px auto;background:#242424;border:1px solid #353535;border-radius:20px;padding:14px}
.section h3{margin:0 0 13px;text-align:right;font-size:14px;color:#ddd}
.history{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;direction:ltr}
.pill{padding:9px 13px;border-radius:11px;background:#193b2e;color:#65e7a7;font-weight:bold;white-space:nowrap;border:1px solid #347e5b}
.pill.low{background:#402020;color:#ff7777;border-color:#a34b54}.pill.mid{background:#3c3017;color:#f4ca68;border-color:#9d7b32}
.info{display:flex;justify-content:space-between;color:#aaa;font-size:12px;margin-top:12px}
.footer{color:#777;font-size:10px;padding:14px 0 22px;letter-spacing:2px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#d68aff;background:#101010;z-index:5;font-size:13px}
@media(max-width:380px){.game{height:390px}.wallet{font-size:12px}.wallet strong{font-size:15px}}
</style>
</head>
<body>
<header>🚀 <span>CRASH</span> GIFT</header>
<div class="sub">PLAY • FLY • WIN</div>
<div class="wallet"><span>💎 VIRTUAL BALANCE</span><strong id="balance">1,000 CG</strong></div>
<div class="game">
 <canvas id="screen"></canvas>
 <div class="multiplier" id="multiplier">1.00x</div>
 <div class="loading" id="loading">در حال بارگذاری موتور سه‌بعدی…</div>
</div>
<div class="status" id="status">READY FOR TAKEOFF?</div>
<div class="controls">
 <div class="betrow">
  <input id="bet" type="number" min="1" step="1" value="50">
  <button onclick="setBet(100)">100</button><button onclick="setBet(500)">500</button>
 </div>
 <div class="buttons"><button id="start" onclick="startGame()">🚀 START</button><button id="cash" onclick="cashOut()" disabled>💎 CASH OUT</button></div>
</div>
<div class="section">
 <h3>📈 RECENT MULTIPLIERS</h3><div class="history" id="history"><span style="color:#777">No rounds yet</span></div>
 <div class="info"><span>CRASH GIFT</span><span>VIRTUAL GAME</span></div>
</div>
<div class="footer">CRASH GIFT • PLAY BEYOND LIMITS</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id),canvas=$('screen');
let balance=Number(localStorage.getItem('cg_balance')||1000),history=JSON.parse(localStorage.getItem('cg_history')||'[]');
let phase='idle',cashed=false,bet=0,mult=1,crashPoint=0,roundStart=0,crashStart=0,prize=0;
let renderer,scene,camera,crafts=[],activeCraft=null,flameLight=null,flames=[],starField;
let smoke=[],embers=[],explosion=[],clock=new THREE.Clock(),twinkleStars=[],collectibles=[],roundNumber=0;
const v=(x,y,z)=>new THREE.Vector3(x,y,z);
function save(){localStorage.setItem('cg_balance',String(balance));localStorage.setItem('cg_history',JSON.stringify(history))}
function updateBalance(){$('balance').textContent=balance.toLocaleString()+' CG'}
window.setBet=n=>{$('bet').value=n};
function basic(color,transparent=false,opacity=1){return new THREE.MeshBasicMaterial({color,transparent,opacity})}
function metal(color,emissive=0x000000,intensity=0){
 return new THREE.MeshPhysicalMaterial({color,metalness:.72,roughness:.2,clearcoat:1,clearcoatRoughness:.08,emissive,emissiveIntensity:intensity});
}
function tube(group,points,r,color){
 const curve=new THREE.CatmullRomCurve3(points);
 group.add(new THREE.Mesh(new THREE.TubeGeometry(curve,36,r,8,false),basic(color)));
}
function makeRocket(){
 const g=new THREE.Group(),cyan=0x39f5ff,pink=0xff38d9,violet=0xb74dff;
 // Open-frame holographic rocket: the central body remains mostly transparent.
 tube(g,[v(-.43,-.92,0),v(-.43,.86,0),v(0,1.88,0)],.035,cyan);
 tube(g,[v(.43,-.92,0),v(.43,.86,0),v(0,1.88,0)],.035,pink);
 tube(g,[v(-.43,-.92,0),v(0,-1.02,0),v(.43,-.92,0)],.025,cyan);
 tube(g,[v(-.43,.86,0),v(0,1.02,.02),v(.43,.86,0)],.025,pink);
 const nose=new THREE.Mesh(new THREE.TorusGeometry(.44,.035,8,48),basic(violet));nose.position.y=.88;g.add(nose);
 for(let i=0;i<8;i++){let a=i*Math.PI/4;tube(g,[v(Math.cos(a)*.44,.88,Math.sin(a)*.18),v(0,1.92,0)],.018,i%2?pink:cyan)}
 const glass=new THREE.Mesh(new THREE.SphereGeometry(.31,24,16),new THREE.MeshPhysicalMaterial({color:0x4eeeff,metalness:.2,roughness:.06,clearcoat:1,emissive:0x00c9e8,emissiveIntensity:.8,transparent:true,opacity:.82}));
 glass.scale.set(1,.76,.25);glass.position.set(0,.43,.27);g.add(glass);
 const frame=new THREE.Mesh(new THREE.TorusGeometry(.34,.026,8,40),basic(cyan));frame.position.set(0,.43,.29);frame.scale.set(1,.8,1);g.add(frame);
 for(const s of [-1,1])tube(g,[v(s*.37,-.48,.02),v(s*.91,-1.12,.02),v(s*.58,-1.26,.02),v(s*.25,-.88,.02),v(s*.37,-.48,.02)],.028,pink);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.29,.035,8,40),basic(0xffdf68));ring.position.y=-1.05;g.add(ring);
 const f1=new THREE.Mesh(new THREE.ConeGeometry(.24,1.15,24,1,true),basic(0xff4bd8,true,.75));f1.rotation.z=Math.PI;f1.position.y=-1.72;g.add(f1);
 const f2=new THREE.Mesh(new THREE.ConeGeometry(.12,.82,20,1,true),basic(cyan,true,.9));f2.rotation.z=Math.PI;f2.position.y=-1.58;g.add(f2);flames.push(f1,f2);
 const halo=new THREE.Mesh(new THREE.TorusGeometry(.78,.018,8,64),basic(violet));halo.position.z=-.14;g.add(halo);
 const light=new THREE.PointLight(0x39eaff,3.2,8);light.position.y=-1.5;g.add(light);
 g.scale.setScalar(1.48);return g;
}
function makePod(){
 const g=new THREE.Group();
 // A stylized pearlescent collectible pod with a rounded crown and flared jeweled foot.
 const pearl=new THREE.MeshPhysicalMaterial({color:0xc8f5ff,metalness:.62,roughness:.12,clearcoat:1,iridescence:1,iridescenceIOR:1.8,iridescenceThicknessRange:[250,850],emissive:0x173c70,emissiveIntensity:.22});
 const profile=[new THREE.Vector2(0,-1.25),new THREE.Vector2(.42,-1.22),new THREE.Vector2(.53,-1.05),new THREE.Vector2(.34,-.83),new THREE.Vector2(.29,-.52),new THREE.Vector2(.38,-.18),new THREE.Vector2(.55,.3),new THREE.Vector2(.57,.68),new THREE.Vector2(.39,1.0),new THREE.Vector2(0,1.12)];
 const body=new THREE.Mesh(new THREE.LatheGeometry(profile,64),pearl);body.scale.set(1,1,0.82);g.add(body);
 for(const [y,r,c] of [[-1.12,.47,0xff55dc],[-.72,.32,0x42edff],[.68,.51,0xffd76b]]){
  const tor=new THREE.Mesh(new THREE.TorusGeometry(r,.035,10,64),basic(c));tor.position.y=y;g.add(tor);
 }
 const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.22,1),metal(0xffffff,0x7b40ff,.65));gem.position.y=.78;g.add(gem);
 const halo=new THREE.Mesh(new THREE.TorusGeometry(.82,.018,8,64),basic(0x65eaff));halo.rotation.x=.9;halo.position.z=-.12;g.add(halo);
 const light=new THREE.PointLight(0xff65d8,2.4,7);light.position.set(0,.2,2);g.add(light);
 g.scale.setScalar(1.28);return g;
}
function makeJet(){
 const g=new THREE.Group(),bodyMat=metal(0x8e9eb6,0x163b80,.3),dark=metal(0x222b43,0x151a40,.25);
 const fuselage=new THREE.Mesh(new THREE.ConeGeometry(.43,3.25,12),bodyMat);fuselage.rotation.x=-Math.PI/2;fuselage.rotation.z=0;fuselage.position.y=.15;g.add(fuselage);
 // Nose cone and cockpit sit toward the front/top.
 const nose=new THREE.Mesh(new THREE.ConeGeometry(.42,1.05,16),metal(0xdcecff,0x2266aa,.3));nose.position.y=1.95;g.add(nose);
 const cockpit=new THREE.Mesh(new THREE.SphereGeometry(.3,24,16),new THREE.MeshPhysicalMaterial({color:0x32dfff,metalness:.3,roughness:.05,clearcoat:1,transparent:true,opacity:.88,emissive:0x0088ff,emissiveIntensity:.8}));
 cockpit.scale.set(.78,1.25,.45);cockpit.position.set(0,.82,.34);g.add(cockpit);
 const wingShape=new THREE.Shape();wingShape.moveTo(0,.45);wingShape.lineTo(1.55,-.65);wingShape.lineTo(1.25,-.92);wingShape.lineTo(0,-.55);wingShape.closePath();
 const wingGeo=new THREE.ShapeGeometry(wingShape);
 for(const s of [-1,1]){
  const wing=new THREE.Mesh(wingGeo,bodyMat);wing.scale.x=s;wing.position.z=.02;g.add(wing);
  const neon=new THREE.Mesh(new THREE.EdgesGeometry(wingGeo),basic(s<0?0x36eaff:0xff4bd8));neon.scale.x=s;neon.position.z=.05;g.add(neon);
  const fin=new THREE.Mesh(new THREE.BoxGeometry(.12,.9,.08),dark);fin.position.set(s*.9,-.73,.12);fin.rotation.z=s*.18;g.add(fin);
 }
 const tail=new THREE.Mesh(new THREE.BoxGeometry(1.1,.12,.34),dark);tail.position.y=-1.05;g.add(tail);
 for(const s of [-1,1]){
  const engine=new THREE.Mesh(new THREE.CylinderGeometry(.16,.23,.52,20),metal(0x59677d));engine.rotation.x=Math.PI/2;engine.position.set(s*.27,-1.35,0);g.add(engine);
  const glow=new THREE.Mesh(new THREE.ConeGeometry(.14,.8,20,1,true),basic(s<0?0x39eaff:0xff50d8,true,.82));glow.rotation.z=Math.PI;glow.position.set(s*.27,-1.85,0);g.add(glow);flames.push(glow);
 }
 const halo=new THREE.Mesh(new THREE.TorusGeometry(1.15,.018,8,64),basic(0x9a58ff));halo.position.z=-.25;g.add(halo);
 g.scale.setScalar(1.18);return g;
}
function createDecorations(){
 for(let i=0;i<58;i++){
  const m=basic(i%4===0?0xffd86b:(i%3===0?0x45eaff:0xffffff),true,.6);
  const s=new THREE.Mesh(new THREE.OctahedronGeometry(.035+Math.random()*.045,0),m);
  s.position.set((Math.random()-.5)*22,(Math.random()-.5)*12,-3-Math.random()*13);
  s.userData={phase:Math.random()*6.28,speed:1.2+Math.random()*2.4,base:s.scale.x};scene.add(s);twinkleStars.push(s);
 }
 const colors=[0xffcf55,0x45efff,0xff55d9,0xb875ff,0x7dffca,0xff8c48];
 for(let i=0;i<6;i++){
  const g=new THREE.Group(),c=colors[i],m=metal(0x171421,c,.18);
  const box=new THREE.Mesh(new THREE.BoxGeometry(.62,.62,.42),m);g.add(box);
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(.65,.65,.45)),basic(c)));
  const rv=new THREE.Mesh(new THREE.BoxGeometry(.11,.68,.47),basic(c));g.add(rv);
  const rh=new THREE.Mesh(new THREE.BoxGeometry(.68,.10,.47),basic(c));g.add(rh);
  const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.23),basic(c));gem.position.y=.49;g.add(gem);
  const halo=new THREE.Mesh(new THREE.TorusGeometry(.48,.012,6,36),basic(c,true,.72));halo.rotation.x=.8;g.add(halo);
  g.position.set((i%3-1)*6.1+(i%2?.65:-.65),Math.floor(i/3)*5-2.5,-7-(i%3)*1.5);
  g.scale.setScalar(.68);g.userData={phase:i*1.7,baseY:g.position.y};scene.add(g);collectibles.push(g);
 }
}
function createWorld(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x101010);
 camera=new THREE.PerspectiveCamera(48,1,.1,1000);camera.position.set(0,1,24);
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
 scene.add(new THREE.HemisphereLight(0x9a9ab8,0x120b18,1.1));
 const key=new THREE.PointLight(0x9d4cff,32,38);key.position.set(2,6,9);scene.add(key);
 const cyan=new THREE.PointLight(0x00dfff,22,30);cyan.position.set(-5,2,5);scene.add(cyan);
 const pink=new THREE.PointLight(0xff28cf,18,25);pink.position.set(5,-2,5);scene.add(pink);
 const count=650,p=new Float32Array(count*3);
 for(let i=0;i<count;i++){p[i*3]=(Math.random()-.5)*95;p[i*3+1]=(Math.random()-.5)*65;p[i*3+2]=-Math.random()*75-8}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(p,3));
 starField=new THREE.Points(geo,new THREE.PointsMaterial({color:0xd8d2e6,size:.11,sizeAttenuation:true,transparent:true,opacity:.72}));scene.add(starField);
 createDecorations();
 crafts=[makePod(),makeRocket(),makeJet()];crafts.forEach((c,i)=>{c.visible=i===0;scene.add(c)});
 activeCraft=crafts[0];
}
function resize(){if(!renderer)return;const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);
function addParticles(list,pos,color,n,spread,speed,size){
 for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(size*(.45+Math.random()),8,6),basic(color,true,.8));m.position.copy(pos).add(v((Math.random()-.5)*spread,(Math.random()-.5)*spread,(Math.random()-.5)*spread));scene.add(m);list.push({mesh:m,vel:v((Math.random()-.5)*speed,(Math.random()-.5)*speed,(Math.random()-.5)*speed),life:1})}
}
function updateParticles(list,dt,fade=.8){
 for(let i=list.length-1;i>=0;i--){const p=list[i];p.mesh.position.addScaledVector(p.vel,dt);p.vel.y-=dt*.7;p.life-=dt*fade;p.mesh.scale.multiplyScalar(1+dt*.4);p.mesh.material.opacity=Math.max(0,p.life*.8);if(p.life<=0){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();list.splice(i,1)}}
}
function flightPosition(){const t=Math.max(0,mult-1),d=Math.log(1+t*1.9)*4.7;return v(-1.5+d*.43,-3.2+d*.9+Math.sin(performance.now()*.0018)*.12,0)}
function setCameraTarget(pos,dt){const desired=v(pos.x-1.5,pos.y+1.2,24);camera.position.lerp(desired,1-Math.exp(-dt*2.8));camera.lookAt(pos.x,pos.y+.2,-5)}
function chooseCraft(){
 crafts.forEach(c=>c.visible=false);
 activeCraft=crafts[roundNumber%crafts.length];roundNumber++;
 activeCraft.visible=true;activeCraft.position.set(-1.5,-3.2,0);activeCraft.rotation.set(0,0,-.12);activeCraft.scale.multiplyScalar(.78);
}
function beginCrash(){
 if(phase!=='flight')return;phase='crash';crashStart=performance.now();$('cash').disabled=true;
 $('status').textContent=cashed?'🎉 جایزه ثبت شد؛ سقوط را تماشا کن!':'💥 وسیله پرنده در حال سقوط است!';
 $('multiplier').classList.add('crashed');$('multiplier').textContent='💥 '+crashPoint.toFixed(2)+'x';
}
function completeRound(){
 phase='idle';$('start').disabled=false;$('cash').disabled=true;
 $('status').textContent=cashed?'🎉 برنده شدی! دور بعد آماده است':'💥 سقوط کرد؛ دور بعد آماده است';
 history.unshift(crashPoint);history=history.slice(0,30);save();renderHistory();updateBalance();
}
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),now=performance.now();
 if(phase==='flight'){const seconds=(now-roundStart)/1000;mult=Math.exp(seconds*.22);if(mult>=crashPoint){mult=crashPoint;beginCrash()}else $('multiplier').textContent=mult.toFixed(2)+'x'}
 if(phase==='crash'){
  const elapsed=(now-crashStart)/1000;activeCraft.rotation.z=-.28-elapsed*1.35;activeCraft.rotation.x=Math.sin(elapsed*9)*.12;
  activeCraft.position.y-=dt*(2.2+elapsed*4.8);activeCraft.position.x+=dt*1.1;
  if(Math.random()<.8)addParticles(smoke,activeCraft.position,0x6b6678,2,1.4,1.1,.18);
  if(elapsed>.42&&explosion.length===0)addParticles(explosion,activeCraft.position,0xff43d7,90,3,7,.16);
  if(elapsed>2.7)completeRound();
 }else if(phase==='flight'){
  const pos=flightPosition();activeCraft.position.lerp(pos,1-Math.exp(-dt*5));
  activeCraft.rotation.z=-.28+Math.sin(now*.002)*.018;activeCraft.rotation.x=Math.sin(now*.0014)*.025;
  activeCraft.scale.lerp(activeCraft.userData.targetScale||new THREE.Vector3(1,1,1),1-Math.exp(-dt*3));
  flames.forEach(f=>{f.scale.y=.78+Math.random()*.42});
  if(Math.random()<.72)addParticles(embers,activeCraft.position.clone().add(v(-2.1,0,0)),0x39f5ff,2,1.1,2,.055);
 }else{
  activeCraft.rotation.z=-.12;activeCraft.position.lerp(v(-1.5,-3.2,0),.035);
 }
 setCameraTarget(activeCraft.position,dt);
 starField.rotation.y+=dt*.0008;
 twinkleStars.forEach(s=>{const pulse=.5+.5*Math.sin(now*.001*s.userData.speed+s.userData.phase);s.material.opacity=.12+pulse*.82;s.scale.setScalar(s.userData.base*(.65+pulse*.75))});
 collectibles.forEach(g=>{const t=now*.001+g.userData.phase;g.rotation.y=t*.48;g.rotation.x=Math.sin(t*.7)*.16;g.position.y=g.userData.baseY+Math.sin(t*1.25)*.22});
 updateParticles(embers,dt,1.4);updateParticles(smoke,dt,.36);updateParticles(explosion,dt,.95);
 renderer.render(scene,camera);
}
function renderHistory(){
 $('history').innerHTML='';if(!history.length){$('history').innerHTML='<span style="color:#777">No rounds yet</span>';return}
 history.slice(0,15).forEach(n=>{const el=document.createElement('span');el.className='pill '+(n<2?'low':n<5?'mid':'');el.textContent=n.toFixed(2)+'x';$('history').appendChild(el)});
}
window.startGame=function(){
 if(phase!=='idle')return;bet=Number($('bet').value);
 if(!Number.isInteger(bet)||bet<1||bet>balance){$('status').textContent='INVALID BET AMOUNT';return}
 balance-=bet;save();updateBalance();mult=1;cashed=false;prize=0;chooseCraft();
 activeCraft.userData.targetScale=activeCraft.scale.clone().multiplyScalar(1/0.78);
 crashPoint=Math.max(1.05,.98/Math.random());roundStart=performance.now();phase='flight';
 $('start').disabled=true;$('cash').disabled=false;$('multiplier').classList.remove('crashed');$('multiplier').textContent='1.00x';
 const names=['✨ POD MODE','🚀 ROCKET MODE','✈️ FIGHTER JET MODE'];$('status').textContent=names[(roundNumber-1)%3]+' • TAKEOFF!';
};
window.cashOut=function(){if(phase!=='flight'||cashed)return;cashed=true;prize=Math.floor(bet*mult);balance+=prize;$('cash').disabled=true;$('status').textContent='🎉 '+prize.toLocaleString()+' CG دریافت کردی؛ پرواز ادامه دارد!';save();updateBalance()};
try{createWorld();resize();$('loading').style.display='none';animate()}catch(e){console.error(e);$('loading').textContent='موتور سه‌بعدی بارگذاری نشد؛ اتصال اینترنت را بررسی کن.'}
updateBalance();renderHistory();
</script>
</body>
</html>
