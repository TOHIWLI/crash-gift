<style>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id),canvas=$('screen');

try{history=JSON.parse(localStorage.getItem('cg_history')||'[]');if(!Array.isArray(history))history=[]}catch(e){history=[]}
let phase='idle',cashed=false,bet=0,mult=1,crashPoint=0,roundStart=0,crashStart=0,prize=0;
let renderer,scene,camera,orb,platform,planet,station,clock=new THREE.Clock(),twinkles=[],particles=[],orbRings=[],energyLines=[],trailPositions=[],trailLine,trailLine2,orbLight,haloSprites=[];
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function save(){localStorage.setItem('cg_balance',String(balance));localStorage.setItem('cg_history',JSON.stringify(history))}
function updateBalance(){$('balance').textContent=balance.toLocaleString()+' CG'}
window.setBet=n=>$('bet').value=n;
function physical(color,metalness=.35,roughness=.18,emissive=0x000000,intensity=0){return new THREE.MeshPhysicalMaterial({color,metalness,roughness,clearcoat:1,clearcoatRoughness:.06,emissive,emissiveIntensity:intensity})}
function glowTexture(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),g=x.createRadialGradient(128,128,3,128,128,126);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.12,'rgba(226,190,255,.95)');g.addColorStop(.28,'rgba(171,66,255,.48)');g.addColorStop(.58,'rgba(105,35,255,.16)');g.addColorStop(1,'rgba(80,20,255,0)');x.fillStyle=g;x.fillRect(0,0,256,256);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function sprite(parent,size,opacity=1,tint=0xffffff){const m=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture(),color:tint,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false}));m.scale.set(size,size,1);parent.add(m);haloSprites.push(m);return m}
function makeOrb(){
 const g=new THREE.Group();
 const shell=new THREE.Mesh(new THREE.SphereGeometry(.68,96,72),physical(0x9b52ff,.52,.12,0x651aff,1.25));g.add(shell);
 const inner=new THREE.Mesh(new THREE.SphereGeometry(.49,80,64),new THREE.MeshPhysicalMaterial({color:0xeee7ff,metalness:.18,roughness:.08,clearcoat:1,emissive:0x8e37ff,emissiveIntensity:1.35,transparent:true,opacity:.94}));g.add(inner);
 const core=new THREE.Mesh(new THREE.SphereGeometry(.29,64,48),new THREE.MeshBasicMaterial({color:0xffffff}));g.add(core);
 const innerGlow=new THREE.Mesh(new THREE.SphereGeometry(.78,48,40),new THREE.MeshBasicMaterial({color:0x9c31ff,transparent:true,opacity:.11,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));g.add(innerGlow);
 sprite(g,4.4,.8,0x8c25ff);sprite(g,2.65,.9,0x3d8dff);
 const ringDefs=[{r:.91,t:.035,c:0x9c4dff,rx:.25,ry:.15},{r:1.08,t:.018,c:0x54dfff,rx:1.08,ry:.42},{r:1.28,t:.025,c:0xe66aff,rx:.68,ry:-.55},{r:.79,t:.012,c:0xffffff,rx:1.42,ry:.12}];
 ringDefs.forEach((d,i)=>{const q=new THREE.Mesh(new THREE.TorusGeometry(d.r,d.t,12,120),new THREE.MeshBasicMaterial({color:d.c,transparent:true,opacity:i===3?.85:.72,blending:THREE.AdditiveBlending}));q.rotation.set(d.rx,d.ry,i*.7);g.add(q);orbRings.push({mesh:q,speed:(i%2?-.55:.38)*(i+1)})});
 for(let i=0;i<3;i++){const arc=new THREE.Mesh(new THREE.TorusGeometry(1.42+i*.09,.012,8,100,Math.PI*.72),new THREE.MeshBasicMaterial({color:[0x45dfff,0xc24cff,0xffffff][i],transparent:true,opacity:.78,blending:THREE.AdditiveBlending}));arc.rotation.set(.5+i*.55,.3+i*.7,i*1.1);g.add(arc);orbRings.push({mesh:arc,speed:(i%2?-.7:.6)})}
 orbLight=new THREE.PointLight(0x9d36ff,7,12);orbLight.position.set(0,0,1);g.add(orbLight);
 return g;
}
function makePlatform(){
 const g=new THREE.Group();
 const base=new THREE.Mesh(new THREE.CylinderGeometry(1.8,2.15,.28,96),physical(0x17112d,.82,.22,0x37106f,.5));base.position.y=-.18;g.add(base);
 const top=new THREE.Mesh(new THREE.CylinderGeometry(1.52,1.8,.08,96),physical(0x292044,.72,.2,0x5120a9,.65));top.position.y=0;g.add(top);
 for(let i=0;i<3;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(1.15+i*.35,.018,8,100),new THREE.MeshBasicMaterial({color:[0x9c43ff,0x42dfff,0xe9aaff][i],transparent:true,opacity:.8,blending:THREE.AdditiveBlending}));r.rotation.x=Math.PI/2;r.position.y=.06+i*.015;g.add(r);orbRings.push({mesh:r,speed:.3+i*.18})}
 const pillar=new THREE.Mesh(new THREE.CylinderGeometry(.018,.12,1.35,24,1,true),new THREE.MeshBasicMaterial({color:0x9d45ff,transparent:true,opacity:.28,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));pillar.position.y=.76;g.add(pillar);
 const light=new THREE.PointLight(0x7d35ff,4,7);light.position.y=1;g.add(light);
 g.position.set(0,-3.15,0);scene.add(g);return g;
}
function createSpace(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x07020f);scene.fog=new THREE.FogExp2(0x090318,.008);
 camera=new THREE.PerspectiveCamera(47,1,.1,300);camera.position.set(0,0,22);
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;
 scene.add(new THREE.HemisphereLight(0xd9c7ff,0x10051e,1.5));const key=new THREE.PointLight(0xb34cff,38,55);key.position.set(0,5,8);scene.add(key);const blue=new THREE.PointLight(0x266dff,24,38);blue.position.set(-7,-2,5);scene.add(blue);const pink=new THREE.PointLight(0xff45d6,17,30);pink.position.set(7,2,4);scene.add(pink);
 const starGeo=new THREE.BufferGeometry(),arr=new Float32Array(1500*3);for(let i=0;i<1500;i++){arr[i*3]=(Math.random()-.5)*100;arr[i*3+1]=(Math.random()-.5)*90;arr[i*3+2]=-Math.random()*75-8}starGeo.setAttribute('position',new THREE.BufferAttribute(arr,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xe9dfff,size:.11,transparent:true,opacity:.9,sizeAttenuation:true})));
 for(let i=0;i<95;i++){const s=new THREE.Mesh(new THREE.OctahedronGeometry(.022+Math.random()*.045),new THREE.MeshBasicMaterial({color:i%4?0xffffff:0xd88bff,transparent:true,opacity:.7}));s.position.set((Math.random()-.5)*34,(Math.random()-.5)*25,-2-Math.random()*22);s.userData={p:Math.random()*6.28};scene.add(s);twinkles.push(s)}
 planet=new THREE.Group();const sphere=new THREE.Mesh(new THREE.SphereGeometry(4.1,64,64),new THREE.MeshStandardMaterial({color:0x30245f,roughness:.82,metalness:.12,emissive:0x160b3d,emissiveIntensity:.5}));planet.add(sphere);const atm=new THREE.Mesh(new THREE.SphereGeometry(4.22,64,64),new THREE.MeshBasicMaterial({color:0x9d50ff,transparent:true,opacity:.12,side:THREE.BackSide}));planet.add(atm);const ring=new THREE.Mesh(new THREE.TorusGeometry(5.2,.055,12,120),new THREE.MeshBasicMaterial({color:0x9d45ff,transparent:true,opacity:.8}));ring.rotation.x=1.28;planet.add(ring);planet.position.set(-8,1,-9);scene.add(planet);
 station=new THREE.Group();for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,2.2,16),physical(0x6c7898,.8,.25,0x5a2caa,.4));m.rotation.z=Math.PI/2;station.add(m);const panel=new THREE.Mesh(new THREE.BoxGeometry(2.2,.06,1.15),physical(0x263c72,.6,.25,0x173dff,.8));panel.position.set(i===0?-2:2,0,0);station.add(panel)}station.position.set(8,2,-8);scene.add(station);
 orb=makeOrb();orb.position.set(0,-2.12,0);scene.add(orb);platform=makePlatform();
 const trailGeo=new THREE.BufferGeometry();trailPositions=new Array(48).fill(0).flatMap(()=>[0,0,0]);trailGeo.setAttribute('position',new THREE.Float32BufferAttribute(trailPositions,3));trailLine=new THREE.Line(trailGeo,new THREE.LineBasicMaterial({color:0xc45bff,transparent:true,opacity:.8,blending:THREE.AdditiveBlending}));trailLine2=new THREE.Line(trailGeo.clone(),new THREE.LineBasicMaterial({color:0x45cfff,transparent:true,opacity:.45,blending:THREE.AdditiveBlending}));trailLine.frustumCulled=false;trailLine2.frustumCulled=false;scene.add(trailLine,trailLine2);
}
function resize(){if(!renderer)return;const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);
function spawnParticles(pos,n=3){for(let i=0;i<n;i++){const color=Math.random()<.55?0xb94dff:0x51dfff,m=new THREE.Mesh(new THREE.SphereGeometry(.018+Math.random()*.04,8,6),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9,blending:THREE.AdditiveBlending}));m.position.copy(pos).add(V((Math.random()-.5)*.7,(Math.random()-.5)*.7,(Math.random()-.5)*.4));scene.add(m);particles.push({m,vel:V((Math.random()-.5)*1.8,-1.1-Math.random()*2,(Math.random()-.5)*.7),life:.45+Math.random()*.65})}}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.m.position.addScaledVector(p.vel,dt);p.life-=dt;p.m.material.opacity=Math.max(0,p.life);p.m.scale.multiplyScalar(1+dt*1.5);if(p.life<=0){scene.remove(p.m);p.m.geometry.dispose();p.m.material.dispose();particles.splice(i,1)}}}
function updateTrail(){const a=trailLine.geometry.attributes.position.array,b=trailLine2.geometry.attributes.position.array;for(let i=0;i<48;i++){const t=i/47,y=orb.position.y-t*5.2,x=orb.position.x+Math.sin(i*.28+performance.now()*.001)*(.05+t*.14);a[i*3]=x;a[i*3+1]=y;a[i*3+2]=.05;b[i*3]=x+.055;b[i*3+1]=y;b[i*3+2]=-.03}trailLine.geometry.attributes.position.needsUpdate=true;trailLine2.geometry.attributes.position.needsUpdate=true;}
function beginCrash(){if(phase!=='flight')return;phase='crash';crashStart=performance.now();$('cash').disabled=true;$('status').textContent=cashed?'✦ جایزه ثبت شد؛ انرژی را تماشا کن!':'✦ انرژی ناپایدار شد!';$('multiplier').classList.add('crashed');$('multiplier').textContent='✦ '+crashPoint.toFixed(2)+'x'}
function completeRound(){phase='idle';orb.visible=true;orb.scale.setScalar(1);orbRings.forEach(r=>{r.mesh.scale.setScalar(1);r.mesh.material.opacity=.72});orbLight.intensity=6.5;$('start').disabled=false;$('cash').disabled=true;$('status').textContent=cashed?'✦ برنده شدی! دور بعد آماده است':'انرژی خاموش شد؛ دور بعد آماده است';history.unshift(crashPoint);history=history.slice(0,30);save();renderHistory();updateBalance()}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),now=performance.now();
 if(phase==='flight'){const sec=(now-roundStart)/1000;mult=Math.exp(sec*.22);if(mult>=crashPoint){mult=crashPoint;beginCrash()}else $('multiplier').textContent=mult.toFixed(2)+'x';
  const travel=(Math.exp(sec*.34)-1)*1.08;orb.position.y=-2.12+travel;orb.position.x=Math.sin(sec*1.5)*.12;const pulse=1+Math.sin(now*.008)*.035+Math.min(sec*.012,.12);orb.scale.setScalar(pulse);orb.rotation.y+=dt*.85;orb.rotation.x+=dt*.28;orbRings.forEach(r=>{r.mesh.rotation.z+=dt*r.speed});orbLight.intensity=7+Math.sin(now*.009)*1.8+Math.min(sec,8)*.35;if(Math.random()<.9)spawnParticles(orb.position.clone().add(V(0,-.72,0)),2);$('mode').textContent='✦ NEON ENERGY • '+(sec<2?'IGNITION':sec<5?'ACCELERATING':'MAXIMUM ASCENT');
  const camY=Math.max(0,orb.position.y+1.45);camera.position.y+=(camY-camera.position.y)*(1-Math.exp(-dt*2.6));camera.lookAt(0,camera.position.y,0);updateTrail();
 }else if(phase==='crash'){const e=(now-crashStart)/1000;orb.scale.setScalar(Math.max(.001,1-e*.5));orbLight.intensity=Math.max(0,8-e*5);orbRings.forEach(r=>{r.mesh.scale.multiplyScalar(1+dt*.6);r.mesh.material.opacity=Math.max(0,1-e*.5)});if(Math.random()<.9)spawnParticles(orb.position,4);if(e>1.8){orb.visible=false;completeRound()}}
 else{orb.visible=true;orb.scale.setScalar(1+Math.sin(now*.002)*.025);orb.position.set(0,-2.12+Math.sin(now*.0015)*.045,0);orb.rotation.y+=dt*.25;orb.rotation.x=Math.sin(now*.0007)*.08;orbRings.forEach(r=>{r.mesh.rotation.z+=dt*r.speed*.35;r.mesh.material.opacity=.58+.22*Math.sin(now*.002+r.speed)});orbLight.intensity=6.5+Math.sin(now*.003)*.8;camera.position.y+=(0-camera.position.y)*(1-Math.exp(-dt*2));camera.lookAt(0,camera.position.y,0);trailLine.visible=false;trailLine2.visible=false}
 if(phase==='flight'){trailLine.visible=true;trailLine2.visible=true}else if(phase==='crash'){trailLine.visible=true;trailLine2.visible=true}
 if(phase!=='crash'&&platform.position.y>-100)platform.rotation.y+=dt*.12;
 planet.rotation.y+=dt*.012;station.rotation.y+=dt*.025;twinkles.forEach(s=>{s.material.opacity=.18+.75*(.5+.5*Math.sin(now*.002+s.userData.p))});updateParticles(dt);renderer.render(scene,camera)}
function renderHistory(){$('history').innerHTML='';if(!history.length){$('history').innerHTML='<span style="color:#9b88b3">No rounds yet</span>';return}history.slice(0,12).forEach(n=>{const e=document.createElement('span');e.className='pill '+(n<2?'low':n<5?'mid':'');e.textContent=n.toFixed(2)+'x';$('history').appendChild(e)})}
window.startGame=function(){if(phase!=='idle')return;bet=Number($('bet').value);if(!Number.isInteger(bet)||bet<1||bet>balance){$('status').textContent='INVALID BET AMOUNT';return}balance-=bet;save();updateBalance();mult=1;cashed=false;prize=0;crashPoint=Math.max(1.05,.98/Math.random());roundStart=performance.now();phase='flight';orb.visible=true;orb.position.set(0,-2.12,0);orb.scale.setScalar(1);orbRings.forEach(r=>{r.mesh.scale.setScalar(1);r.mesh.material.opacity=.78});trailLine.visible=true;trailLine2.visible=true;camera.position.set(0,0,22);camera.lookAt(0,0,0);$('start').disabled=true;$('cash').disabled=false;$('multiplier').classList.remove('crashed');$('multiplier').textContent='1.00x';$('status').textContent='✦ ENERGY IGNITION • GOOD LUCK';$('mode').textContent='✦ NEON ORB • POWERING UP'};
window.cashOut=function(){if(phase!=='flight'||cashed)return;cashed=true;prize=Math.floor(bet*mult);balance+=prize;$('cash').disabled=true;$('status').textContent='✦ '+prize.toLocaleString()+' CG دریافت کردی؛ صعود ادامه دارد!';save();updateBalance()};
try{createSpace();resize();$('loading').style.display='none';animate()}catch(e){console.error(e);$('loading').textContent='موتور سه‌بعدی بارگذاری نشد؛ اتصال اینترنت را بررسی کن.'}
updateBalance();renderHistory();
</script>
