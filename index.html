
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080313">
<title>CRASH GIFT</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #080313;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  padding: 14px;
}

.app {
  max-width: 480px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 4px 25px;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #ffd36b;
}

.online {
  color: #42e89b;
  font-size: 12px;
}

.balance {
  background: linear-gradient(135deg,#24133f,#100a20);
  border: 1px solid #7442a0;
  border-radius: 18px;
  padding: 19px;
  margin-bottom: 15px;
}

.balance-label {
  color: #bca9d4;
  font-size: 12px;
}

.balance-value {
  font-size: 27px;
  font-weight: bold;
  margin-top: 8px;
  color: #ffd36b;
}

.game {
  background: radial-gradient(circle at center,#32125a,#130a25 65%,#090413);
  border: 1px solid #7735a5;
  border-radius: 22px;
  height: 330px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.multiplier {
  font-size: 55px;
  font-weight: 900;
  color: #ffd36b;
  text-shadow: 0 0 25px #a52cff;
}

.game-status {
  color: #c7b5dc;
  margin-top: 12px;
  font-size: 13px;
}

.dot {
  width: 12px;
  height: 12px;
  background: #ffd36b;
  border-radius: 50%;
  box-shadow: 0 0 20px #ffd36b;
  position: absolute;
  bottom: 35px;
}

.section {
  background: #160d25;
  border: 1px solid #35204d;
  border-radius: 17px;
  padding: 17px;
  margin-top: 15px;
}

.section-title {
  font-size: 14px;
  color: #d7c2ed;
  margin-bottom: 15px;
}

.bet-input {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #63408b;
  background: #090513;
  color: white;
  font-size: 18px;
  outline: none;
  text-align: center;
}

.controls {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px;
  font-weight: bold;
  cursor: pointer;
}

.control {
  flex: 1;
  background: #302044;
  color: white;
}

.bet-button {
  width: 100%;
  margin-top: 12px;
  background: linear-gradient(90deg,#a52cff,#f04cff);
  color: white;
  font-size: 16px;
}

.footer {
  text-align: center;
  color: #806c98;
  font-size: 11px;
  padding: 22px 0;
}
</style>
</head>

<body>
<div class="app">

  <header class="header">
    <div class="logo">CRASH GIFT</div>
    <div class="online">● ONLINE</div>
  </header>

  <section class="balance">
    <div class="balance-label">YOUR DEMO BALANCE</div>
    <div class="balance-value">
      <span id="balance">100.0000</span> GRAM
    </div>
  </section>

  <section class="game">
    <div class="multiplier" id="multiplier">1.00x</div>
    <div class="game-status" id="status">WAITING FOR NEXT ROUND</div>
    <div class="dot"></div>
  </section>

  <section class="section">
    <div class="section-title">PLACE YOUR BET</div>

    <input
      class="bet-input"
      id="bet"
      type="number"
      min="0.1"
      step="0.1"
      value="1"
    >

    <div class="controls">
      <button class="control" onclick="changeBet(2)">×2</button>
      <button class="control" onclick="changeBet(0.5)">÷2</button>
    </div>

    <button class="bet-button" onclick="placeDemoBet()">
      PLACE DEMO BET
    </button>
  </section>

  <section class="section">
    <div class="section-title">ROUND HISTORY</div>
    <div id="history">No completed rounds</div>
  </section>

  <footer class="footer">
    CRASH GIFT · DEMO VERSION
  </footer>

</div>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

let balance = 100;
let history = [];

function changeBet(multiplier) {
  const input = document.getElementById("bet");
  let value = Number(input.value) || 0.1;

  value *= multiplier;
  value = Math.max(0.1, Math.min(balance, value));

  input.value = Number(value.toFixed(4));
}

function placeDemoBet() {
  const input = document.getElementById("bet");
  const amount = Number(input.value);

  if (!Number.isFinite(amount) || amount < 0.1) {
    alert("Minimum bet is 0.1 GRAM");
    return;
  }

  if (amount > balance) {
    alert("Insufficient demo balance");
    return;
  }

  alert("This is a visual prototype. Server betting is not connected yet.");
}

document.getElementById("balance").textContent =
  balance.toFixed(4);
</script>
</body>
</html>
